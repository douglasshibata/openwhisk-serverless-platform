user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Habilitar GZIP para respostas leves
    gzip on;
    gzip_types text/plain application/json application/javascript;

    upstream openwhisk_controller {
        server controller:8888;
        keepalive 32;
    }

    # Redirecionar HTTP para HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # API Gateway com SSL/TLS
    server {
        listen 443 ssl;
        server_name localhost;

        # Certificados Auto-assinados de desenvolvimento corporativo
        ssl_certificate /etc/nginx/certs/openwhisk.crt;
        ssl_certificate_key /etc/nginx/certs/openwhisk.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Roteamento administrativo e execuções do OpenWhisk
        location /api/v1 {
            proxy_pass http://openwhisk_controller;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Desativar buffer para Server-Sent Events ou streamings longos se houver
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # Status do API Gateway
        location /status {
            stub_status;
            access_log off;
        }
    }
}
